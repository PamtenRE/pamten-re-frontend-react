name: Deploy React Frontend to Azure

on:
  push:
    branches:
      - develop
      - feature/**

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: 22
  NODE_ENV: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      # --------------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2. Determine Environment (based on branch)
      # --------------------------------------------------------------
      - name: Set environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-prod" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-prod" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-dev" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-dev" >> "$GITHUB_ENV"
          fi
          echo "Using environment: $ENVIRONMENT"

      # --------------------------------------------------------------
      # 3. Azure Login (OIDC-based)
      # --------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Ensure Azure app settings
        run: |
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings NODE_ENV=production NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      # --------------------------------------------------------------
      # 4. Setup Node.js and Install Dependencies
      # --------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------------
      # 5. Build Next.js Application
      # --------------------------------------------------------------
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # --------------------------------------------------------------
      # 6. Prepare Deployment Package
      # --------------------------------------------------------------
      - name: Prepare deployment package
        run: |
          echo "Creating deployment directory..."
          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone server bundle..."
          cp -r nextjs/standalone/. deploy/

          echo "Copying Next.js static assets..."
          mkdir -p deploy/nextjs/static
          cp -r nextjs/static/. deploy/nextjs/static/

          echo "Copying public assets and config files..."
          cp -r public deploy/public
          cp server.js deploy/
          cp web.config deploy/

          echo "Deployment package prepared successfully"
          ls -la deploy/

      - name: Verify standalone bundle
        run: |
          if [ ! -f "deploy/server.js" ]; then
            echo "ERROR: standalone server.js is missing!"
            exit 1
          fi
          if [ ! -d "deploy/nextjs/static" ]; then
            echo "ERROR: nextjs/static assets missing!"
            exit 1
          fi
          echo "Standalone bundle contents:"
          ls -la deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: deploy
          clean: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy

      - name: Verify site availability
        run: |
          curl -I -f https://${{ env.APP_NAME }}.azurewebsites.net || exit 1
