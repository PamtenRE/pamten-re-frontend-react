name: Deploy React Frontend to Azure

on:
  push:
    branches:
      - develop
      - feature/**

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      # --------------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2. Determine Environment (based on branch)
      # --------------------------------------------------------------
      - name: Set environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-prod" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-prod" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-dev" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-dev" >> "$GITHUB_ENV"
          fi
          echo "Using environment: $ENVIRONMENT"

      # --------------------------------------------------------------
      # 3. Azure Login (OIDC-based)
      # --------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build React (Next.js) App
        run: |
          npm ci
          npm run build
          echo "Build complete, preparing deployment package"
          mkdir deploy
          rsync -av --progress .next package.json node_modules public deploy/ > /dev/null
          echo "Copied .next and dependencies to deploy/"

      - name: Verify .next exists
        run: |
          ls -la deploy/.next || (echo ".next missing!" && exit 1)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: deploy
          clean: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy

      - name: Verify site availability
        run: |
          curl -I -f https://${{ env.APP_NAME }}.azurewebsites.net || exit 1
