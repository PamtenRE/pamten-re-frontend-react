name: Deploy React Frontend to Azure

on:
  push:
    branches:
      - develop
      - feature/**

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      # --------------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2. Determine Environment (based on branch)
      # --------------------------------------------------------------
      - name: Set environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-prod" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-prod" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"
            echo "APP_NAME=pamten-re-frontend-react-dev" >> "$GITHUB_ENV"
            echo "RESOURCE_GROUP=pamten-re-rg-dev" >> "$GITHUB_ENV"
          fi
          echo "Using environment: $ENVIRONMENT"

      # --------------------------------------------------------------
      # 3. Azure Login (OIDC-based)
      # --------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      # --------------------------------------------------------------
      # 4. Setup Node.js and Install Dependencies
      # --------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------------
      # 5. Build Next.js Application
      # --------------------------------------------------------------
      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      # --------------------------------------------------------------
      # 6. Prepare Deployment Package
      # --------------------------------------------------------------
      - name: Prepare deployment package
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy
          
          echo "Copying build artifacts..."
          cp -r .next deploy/
          cp -r public deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp next.config.ts deploy/
          cp server.js deploy/
          cp web.config deploy/
          
          echo "Copying production node_modules..."
          cp -r node_modules deploy/
          
          echo "Deployment package prepared successfully"
          echo "Package contents:"
          ls -la deploy/

      - name: Verify .next folder exists
        run: |
          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: .next folder is missing!"
            exit 1
          fi
          echo ".next folder verified:"
          ls -la deploy/.next

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: deploy
          clean: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy

      - name: Verify site availability
        run: |
          curl -I -f https://${{ env.APP_NAME }}.azurewebsites.net || exit 1
